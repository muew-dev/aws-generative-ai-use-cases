name: CDK Destroy All Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm you want to destroy all infrastructure'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "::error::You must type 'destroy' to confirm the destruction of infrastructure"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup environment
        run: |
          chmod +x setup-env.sh
          ./setup-env.sh

      - name: Clean up S3 buckets before destroy
        run: |
          echo "Cleaning up S3 buckets that might prevent stack deletion"

          # Find all buckets with generative-ai-use-cases pattern
          BUCKETS=$(aws s3api list-buckets --query 'Buckets[?contains(Name, `generativeaiusecasesstack`) || contains(Name, `cloudfront`) || contains(Name, `logging`)].Name' --output text)

          for BUCKET in $BUCKETS; do
            echo "Processing bucket: $BUCKET"

            # Check if bucket exists and is accessible
            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              echo "Cleaning bucket: $BUCKET"

              # Delete all object versions and delete markers
              aws s3api list-object-versions --bucket "$BUCKET" \
                --query 'Versions[].{Key:Key,VersionId:VersionId}' \
                --output text | while read key version; do
                  if [ ! -z "$key" ] && [ ! -z "$version" ]; then
                    aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$version" || true
                  fi
                done

              # Delete all delete markers
              aws s3api list-object-versions --bucket "$BUCKET" \
                --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' \
                --output text | while read key version; do
                  if [ ! -z "$key" ] && [ ! -z "$version" ]; then
                    aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$version" || true
                  fi
                done

              # Final cleanup with simple rm
              aws s3 rm s3://$BUCKET --recursive --quiet || true
              echo "Completed cleaning bucket: $BUCKET"
            else
              echo "Bucket $BUCKET not accessible or doesn't exist"
            fi
          done

          echo "S3 cleanup completed"
        continue-on-error: true

      - name: CDK Destroy All Stacks
        run: |
          echo "Destroying all stacks"
          npm run cdk:destroy -- --all --force

      - name: Cleanup notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice::All infrastructure destruction completed successfully"
          else
            echo "::error::Infrastructure destruction failed. Please check the logs and cleanup manually if needed"
          fi
