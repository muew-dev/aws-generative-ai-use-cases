name: CDK Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'packages/cdk/**'
      - 'packages/lambda/**'
      - 'packages/types/**'
      - 'packages/common/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run CDK tests
        run: npm -w cdk run test -- --testNamePattern="matches the snapshot$"

      - name: Run web tests
        run: npm run web:test

  deploy-default:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'default')
    needs: [test]
    runs-on: ubuntu-latest
    environment: default
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run web:build

      - name: Deploy CDK (Default Environment)
        run: npm run cdk:deploy:quick

  deploy-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    needs: [test]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure AWS credentials (Development)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_DEV }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run web:build

      - name: Deploy CDK (Development Environment)
        run: npm run cdk:deploy:quick -- --context env=dev

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    needs: [test]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STG }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run web:build

      - name: Deploy CDK (Staging Environment)
        run: npm run cdk:deploy:quick -- --context env=staging

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_PROD }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run web:build

      - name: Deploy CDK (Production Environment)
        run: npm run cdk:deploy -- --all --context env=prod --require-approval never

  notify-success:
    if: success()
    needs: [deploy-default, deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment success
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "Environment: ${{ inputs.environment || 'default' }}"
          echo "Commit: ${{ github.sha }}"
