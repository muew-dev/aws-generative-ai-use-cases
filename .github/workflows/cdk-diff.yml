name: CDK Diff

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
    paths:
      - 'packages/cdk/**'
      - 'packages/lambda/**'
      - 'packages/types/**'
      - 'packages/common/**'
      - 'fargate-s3-server/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  diff-default:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Build CDK
        run: npm run cdk:lambda-build-dryrun

      - name: CDK Diff (Default Environment)
        id: cdk-diff
        run: |
          echo "## CDK Diff Results (Default Environment)" > diff-output.md
          echo "" >> diff-output.md
          echo '```' >> diff-output.md
          npm -w cdk run cdk diff -- --all 2>&1 | tee -a diff-output.md
          echo '```' >> diff-output.md
        continue-on-error: true

      - name: Comment PR with diff results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffOutput = fs.readFileSync('diff-output.md', 'utf8');

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('CDK Diff Results')
            );

            const commentBody = `${diffOutput}

            <details>
            <summary>CDK Diff について</summary>

            このdiffは、PR内の変更がAWSリソースにどのような影響を与えるかを示しています:

            - **🟢 CREATE**: 新しいリソースが作成されます
            - **🟡 UPDATE**: 既存のリソースが更新されます
            - **🔴 DELETE**: 既存のリソースが削除されます
            - **🔄 REPLACE**: リソースが削除→再作成されます（データ消失の可能性）

            ⚠️ **REPLACE**の場合はデータ消失の可能性があるため、事前にバックアップを検討してください。
            </details>`;

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  diff-prod:
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_PROD }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Build CDK
        run: npm run cdk:lambda-build-dryrun

      - name: CDK Diff (Production Environment)
        id: cdk-diff-prod
        run: |
          echo "## CDK Diff Results (Production Environment)" > diff-output-prod.md
          echo "" >> diff-output-prod.md
          echo '```' >> diff-output-prod.md
          npm -w cdk run cdk diff -- --all --context env=prod 2>&1 | tee -a diff-output-prod.md
          echo '```' >> diff-output-prod.md
        continue-on-error: true

      - name: Comment PR with production diff results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffOutput = fs.readFileSync('diff-output-prod.md', 'utf8');

            const commentBody = `${diffOutput}

            <details>
            <summary>🔴 Production環境のCDK Diff</summary>

            このdiffは本番環境への影響を示しています。

            **⚠️ 本番環境への変更は慎重に検討してください：**
            - データ消失のリスクがある変更(REPLACE)がないか確認
            - メンテナンス時間外での実行を検討
            - バックアップの事前取得を検討
            - ロールバック手順の準備
            </details>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
